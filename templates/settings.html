<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings · Social Planning</title>
  <link rel="stylesheet" href="{{ shared_assets_base }}/theme.css" />
  <link rel="stylesheet" href="style.css" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2b6f5c" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
</head>
<body>
  <header class="app-header">
    <h1>Settings</h1>
    <p class="subtitle">Locations plans can be tagged with.</p>
  </header>

  <div id="app-nav-mount"></div>

  <main>
    <div id="page-message" class="page-message hidden"></div>

    <section class="settings-section">
      <div class="list-header">
        <h2>Locations</h2>
        <span id="location-count" class="list-count"></span>
      </div>

      <button id="show-add-location" type="button" class="add-toggle">+ Add Location</button>
      <div id="add-location-card" class="add-card hidden"></div>

      <div id="location-list" class="item-list"></div>
      <p class="settings-note">Search to fill a location in from Google, or type the fields yourself. Names are unique (ignoring case), and a looked-up place can only be added once. You can't delete a location still set on a plan.</p>
    </section>
  </main>

  <script src="{{ shared_assets_base }}/theme.js"></script>
  <script src="{{ shared_assets_base }}/icons.js"></script>
  <script src="nav.js"></script>
  <script src="settings.js"></script>
</body>
</html>
