<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Planning</title>
  <link rel="stylesheet" href="{{ shared_assets_base }}/theme.css" />
  <link rel="stylesheet" href="style.css" />

  <!-- Home screen / installed-app support -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2b6f5c" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Plans" />
</head>
<body>
  <header class="app-header">
    <h1>Plans</h1>
  </header>

  <div id="app-nav-mount"></div>

  <main>
    <div id="page-message" class="page-message hidden"></div>

    <button id="show-add-plan" type="button" class="add-toggle">+ Add Plan</button>

    <form id="new-plan-form" class="add-card hidden">
      <div class="field">
        <label for="new-name">Name <span class="required">*</span></label>
        <input id="new-name" name="name" type="text" required placeholder="e.g. Sunset picnic at the park" />
      </div>
      <div class="field">
        <label for="new-description">Description</label>
        <textarea id="new-description" name="description" rows="2" placeholder="Optional notes"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="new-url">URL</label>
          <input id="new-url" name="url" type="url" placeholder="https://instagram.com/p/..." />
        </div>
        <div class="field">
          <label for="new-date">Date</label>
          <input id="new-date" name="event_date" type="date" />
        </div>
      </div>
      <div class="field">
        <label for="new-location">Location</label>
        <select id="new-location" name="location_id"></select>
      </div>
      <div class="item-actions">
        <button type="submit" class="save-btn">Add plan</button>
        <button type="button" id="cancel-add-plan" class="cancel-btn">Cancel</button>
      </div>
    </form>

    <section>
      <div class="list-header">
        <h2>Plans</h2>
        <span id="plan-count" class="list-count"></span>
      </div>
      <div id="plans-list" class="item-list"></div>
      <p id="empty-state" class="empty-state" hidden>No plans yet - add one above to get started.</p>
    </section>
  </main>

  <script src="{{ shared_assets_base }}/theme.js"></script>
  <script src="{{ shared_assets_base }}/icons.js"></script>
  <script src="nav.js"></script>
  <script src="app.js"></script>
</body>
</html>
